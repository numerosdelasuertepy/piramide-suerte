<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pirámide de la Suerte PY 🍀</title>
  <style>
    :root {
      --primary: #1b4332;
      --secondary: #2d6a4f;
      --accent: #d90429;
      --bg: #f8f9fa;
      --card-bg: #ffffff;
      --text: #212529;
      --hot: #e63946;
      --cold: #1d3557;
      --gold: #d4af37;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 550px;
      background: var(--card-bg);
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      position: relative;
    }
    h1 {
      text-align: center;
      color: var(--primary);
      margin-bottom: 5px;
      font-size: 26px;
    }
    .subtitle {
      text-align: center;
      color: #6c757d;
      font-size: 14px;
      margin-bottom: 20px;
    }
    label {
      font-weight: 600;
      display: block;
      margin-top: 12px;
      margin-bottom: 5px;
      font-size: 14px;
    }
    select, input[type="date"], input[type="text"], textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ced4da;
      border-radius: 8px;
      font-size: 14px;
      box-sizing: border-box;
      font-family: inherit;
    }
    button {
      width: 100%;
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 12px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 15px;
      transition: background 0.2s;
    }
    button:hover {
      background-color: var(--secondary);
    }
    .btn-secondary {
      background-color: #495057;
      font-size: 13px;
      padding: 8px;
      margin-top: 8px;
    }
    .btn-danger {
      background-color: #d90429;
      font-size: 11px;
      padding: 4px 8px;
      width: auto;
      margin-top: 0;
      border-radius: 4px;
    }
    .section-title {
      color: var(--primary);
      font-size: 16px;
      border-bottom: 2px solid #e9ecef;
      padding-bottom: 5px;
      margin-top: 25px;
      margin-bottom: 15px;
      font-weight: bold;
    }
    .pyramid-box {
      background: #e8f5e9;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
      font-family: 'Courier New', Courier, monospace;
      font-weight: bold;
      font-size: 18px;
      line-height: 1.4;
      color: var(--primary);
      letter-spacing: 4px;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .card {
      background: #f8f9fa;
      border: 1px solid #e9ecef;
      border-radius: 8px;
      padding: 12px;
      text-align: center;
      margin-bottom: 10px;
    }
    .card-title {
      font-size: 12px;
      font-weight: bold;
      color: #495057;
      text-transform: uppercase;
      margin-bottom: 5px;
    }
    .card-value {
      font-size: 18px;
      font-weight: bold;
      color: var(--accent);
    }
    .hot-badge {
      color: var(--hot);
      font-weight: bold;
      font-size: 14px;
    }
    .cold-badge {
      color: var(--cold);
      font-weight: bold;
      font-size: 14px;
    }
    .stats-panel {
      background: #f1f3f5;
      padding: 14px;
      border-radius: 10px;
      margin-top: 15px;
      border-left: 4px solid var(--primary);
    }
    .admin-panel {
      display: none;
      background: #fff8e1;
      border: 1px solid #ffe082;
      padding: 15px;
      border-radius: 10px;
      margin-top: 20px;
    }
    .badge-chip {
      display: inline-block;
      padding: 4px 8px;
      background: #ffffff;
      border-radius: 6px;
      border: 1px solid #ced4da;
      margin: 2px;
      font-weight: bold;
      font-size: 14px;
    }
    .footer-admin-link {
      text-align: center;
      margin-top: 30px;
      font-size: 12px;
      color: #adb5bd;
      cursor: pointer;
    }
    .history-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 12px;
    }
    .history-table th, .history-table td {
      border: 1px solid #dee2e6;
      padding: 6px;
      text-align: center;
    }
    .history-table th {
      background-color: #e9ecef;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Pirámide de la Suerte PY 🍀</h1>
  <div class="subtitle">Pronósticos y Estadísticas de Loterías</div>

  <label for="gameSelect">Selecciona el Juego / Sorteo:</label>
  <select id="gameSelect" onchange="alCambiarJuego()">
    <option value="quiniela">Quiniela (Paraguay)</option>
    <option value="quini6">Quini 6 (Miércoles y Domingo)</option>
    <option value="megalotto">Mega Lotto PY (Miércoles y Domingo)</option>
  </select>

  <!-- SELECCIÓN DE TURNO PARA QUINIELA (VISTA PÚBLICA) -->
  <div id="turnoContainer">
    <label for="shiftSelect">Selecciona el Turno del Sorteo:</label>
    <select id="shiftSelect" onchange="alCambiarTurno()">
      <option value="general">General (Todos los turnos)</option>
      <option value="tempranero">Tempranero (Lun a Sáb)</option>
      <option value="matutino">Matutino (Lun a Sáb)</option>
      <option value="vespertino">Vespertino (Lun a Dom)</option>
      <option value="nocturno">Nocturno (Lun a Dom)</option>
    </select>
  </div>

  <label for="dateInput">Selecciona la Fecha:</label>
  <input type="date" id="dateInput">

  <!-- VISTA PÚBLICA PARA APOSTADORES -->
  <div id="statsContainer"></div>

  <button onclick="generar()">Generar Pronóstico Magnético</button>

  <div class="section-title">Pirámide del Día</div>
  <div id="pyramidContainer" class="pyramid-box">--</div>

  <div id="resultsTitle" class="section-title">Resultados</div>
  <div id="resultsContainer"></div>

  <!-- PANEL ESTRUCTURADO DE ADMINISTRACIÓN -->
  <div id="adminPanel" class="admin-panel">
    <div style="font-weight:bold; color:#856404; margin-bottom:10px;">🔒 Panel de Carga Oficial (Administrador)</div>
    
    <label for="adminGameSelect">Juego a Cargar:</label>
    <select id="adminGameSelect" onchange="actualizarFormularioAdmin()">
      <option value="quiniela">Quiniela (Paraguay)</option>
      <option value="quini6">Quini 6</option>
      <option value="megalotto">Mega Lotto PY</option>
    </select>

    <label for="adminDrawDate">Fecha del Sorteo:</label>
    <input type="date" id="adminDrawDate">

    <div id="adminShiftBox">
      <label for="adminDrawShift">Turno del Sorteo:</label>
      <select id="adminDrawShift">
        <option value="tempranero">Tempranero</option>
        <option value="matutino">Matutino</option>
        <option value="vespertino">Vespertino</option>
        <option value="nocturno">Nocturno</option>
      </select>
    </div>

    <label for="adminDrawResult" id="adminResultLabel">Número a la Cabeza (2 cifras):</label>
    <input type="text" id="adminDrawResult" placeholder="Ejemplo: 45">

    <button class="btn-secondary" onclick="guardarSorteoAdmin()"> Registrar Sorteo</button>

    <div style="font-weight:bold; font-size:12px; margin-top:15px; color:#495057;">📋 ÚLTIMOS SORTEOS CARGADOS:</div>
    <div id="adminHistoryTable"></div>
  </div>

  <div class="footer-admin-link" onclick="toggleAdminPanel()">🔒 Acceso Administrador</div>
</div>

<script>
  document.getElementById('dateInput').valueAsDate = new Date();
  document.getElementById('adminDrawDate').valueAsDate = new Date();

  const urlParams = new URLSearchParams(window.location.search);
  if (urlParams.get('admin') === '1') {
    document.getElementById('adminPanel').style.display = 'block';
  }

  function toggleAdminPanel() {
    const p = document.getElementById('adminPanel');
    if (p.style.display === 'block') {
      p.style.display = 'none';
    } else {
      const pass = prompt("Ingresa la clave de administrador:");
      if (pass === "1234") {
        p.style.display = 'block';
        actualizarFormularioAdmin();
      } else if (pass !== null) {
        alert("Clave incorrecta");
      }
    }
  }

  function actualizarFormularioAdmin() {
    const juego = document.getElementById('adminGameSelect').value;
    const shiftBox = document.getElementById('adminShiftBox');
    const resultLabel = document.getElementById('adminResultLabel');
    const resultInput = document.getElementById('adminDrawResult');

    if (juego === 'quiniela') {
      shiftBox.style.display = 'block';
      resultLabel.innerText = 'Número a la Cabeza (2 cifras):';
      resultInput.placeholder = 'Ejemplo: 45';
    } else {
      shiftBox.style.display = 'none';
      resultLabel.innerText = '6 Números Ganadores (separados por espacio o coma):';
      resultInput.placeholder = 'Ejemplo: 04 12 18 25 31 36';
    }
    renderizarTablaAdmin();
  }

  function obtenerLlaveStorage(juego, turno) {
    if (juego === 'quiniela') {
      return `sorteos_quiniela_${turno}`;
    }
    return `sorteos_${juego}`;
  }

  function guardarSorteoAdmin() {
    const juego = document.getElementById('adminGameSelect').value;
    const fecha = document.getElementById('adminDrawDate').value;
    const turno = document.getElementById('adminDrawShift').value;
    const resultadoRaw = document.getElementById('adminDrawResult').value.trim();

    if (!fecha || !resultadoRaw) {
      alert("Por favor completa la fecha y el resultado del sorteo.");
      return;
    }

    const key = obtenerLlaveStorage(juego, turno);
    let lista = JSON.parse(localStorage.getItem(key) || '[]');

    lista.unshift({
      id: Date.now(),
      fecha: fecha,
      turno: juego === 'quiniela' ? turno : 'N/A',
      resultado: resultadoRaw
    });

    // Guardar máximo los últimos 30 sorteos
    lista = lista.slice(0, 30);
    localStorage.setItem(key, JSON.stringify(lista));

    document.getElementById('adminDrawResult').value = '';
    alert("Sorteo registrado exitosamente.");
    
    renderizarTablaAdmin();
    analizarFrecuencias();
  }

  function eliminarSorteoAdmin(key, id) {
    let lista = JSON.parse(localStorage.getItem(key) || '[]');
    lista = lista.filter(item => item.id !== id);
    localStorage.setItem(key, JSON.stringify(lista));
    renderizarTablaAdmin();
    analizarFrecuencias();
  }

  function renderizarTablaAdmin() {
    const juego = document.getElementById('adminGameSelect').value;
    const turno = document.getElementById('adminDrawShift').value;
    const key = obtenerLlaveStorage(juego, turno);
    const lista = JSON.parse(localStorage.getItem(key) || '[]');
    const container = document.getElementById('adminHistoryTable');

    if (lista.length === 0) {
      container.innerHTML = '<div style="font-size:11px; color:#6c757d; margin-top:5px;">No hay sorteos registrados para este filtro.</div>';
      return;
    }

    let html = `
      <table class="history-table">
        <thead>
          <tr>
            <th>Fecha</th>
            ${juego === 'quiniela' ? '<th>Turno</th>' : ''}
            <th>Resultado</th>
            <th>Acción</th>
          </tr>
        </thead>
        <tbody>
    `;

    lista.forEach(item => {
      html += `
        <tr>
          <td>${item.fecha}</td>
          ${juego === 'quiniela' ? `<td>${item.turno}</td>` : ''}
          <td><b>${item.resultado}</b></td>
          <td><button class="btn-danger" onclick="eliminarSorteoAdmin('${key}', ${item.id})">X</button></td>
        </tr>
      `;
    });

    html += '</tbody></table>';
    container.innerHTML = html;
  }

  function alCambiarJuego() {
    const juego = document.getElementById('gameSelect').value;
    const turnoContainer = document.getElementById('turnoContainer');

    if (juego === 'quiniela') {
      turnoContainer.style.display = 'block';
    } else {
      turnoContainer.style.display = 'none';
    }
    analizarFrecuencias();
  }

  function alCambiarTurno() {
    analizarFrecuencias();
  }

  function obtenerNumerosProcesadosPublicos() {
    const juego = document.getElementById('gameSelect').value;
    const turno = document.getElementById('shiftSelect').value;

    let llavesAProcesar = [];
    if (juego === 'quiniela') {
      if (turno === 'general') {
        llavesAProcesar = [
          'sorteos_quiniela_tempranero',
          'sorteos_quiniela_matutino',
          'sorteos_quiniela_vespertino',
          'sorteos_quiniela_nocturno'
        ];
      } else {
        llavesAProcesar = [`sorteos_quiniela_${turno}`];
      }
    } else {
      llavesAProcesar = [`sorteos_${juego}`];
    }

    let todosResultados = [];
    llavesAProcesar.forEach(key => {
      const lista = JSON.parse(localStorage.getItem(key) || '[]');
      lista.forEach(item => {
        const tokens = item.resultado.replace(/[\n\r;,-]/g, ' ').split(/\s+/).filter(t => t.length > 0);
        tokens.forEach(t => {
          let num = parseInt(t);
          if (!isNaN(num)) {
            todosResultados.push(num < 10 ? '0' + num : '' + num);
          }
        });
      });
    });

    return todosResultados;
  }

  function analizarFrecuencias() {
    const numeros = obtenerNumerosProcesadosPublicos();
    const statsBox = document.getElementById('statsContainer');

    if (numeros.length === 0) {
      statsBox.innerHTML = `
        <div class="stats-panel" style="text-align:center; color:#6c757d; font-size:13px;">
          📊 <i>Análisis listo para recibir el historial de sorteos oficiales.</i>
        </div>
      `;
      return { calientes: [], frios: [] };
    }

    const conteo = {};
    numeros.forEach(num => {
      conteo[num] = (conteo[num] || 0) + 1;
    });

    const ordenados = Object.keys(conteo).sort((a, b) => conteo[b] - conteo[a]);
    const calientes = ordenados.slice(0, 4);
    const frios = ordenados.slice(-4).reverse();

    const juego = document.getElementById('gameSelect').value;
    const tituloEstadistica = juego === 'quiniela' ? '📊 Tendencia "A la Cabeza" (Sorteos Registrados)' : '📊 Tendencias de Frecuencia Oficiales';

    statsBox.innerHTML = `
      <div class="stats-panel">
        <div style="font-weight:bold; font-size:13px; color:var(--primary); margin-bottom:8px;">${tituloEstadistica}</div>
        <div class="grid-2">
          <div>
            <span class="hot-badge">🔥 Más Frecuentes:</span><br>
            ${calientes.map(n => `<span class="badge-chip" style="color:var(--hot);">${n} <small>(${conteo[n]}x)</small></span>`).join('')}
          </div>
          <div>
            <span class="cold-badge">❄️ Fríos / Atrasados:</span><br>
            ${frios.map(n => `<span class="badge-chip" style="color:var(--cold);">${n} <small>(${conteo[n]}x)</small></span>`).join('')}
          </div>
        </div>
      </div>
    `;

    return { calientes, frios };
  }

  function calcularNumeroAtraccion(fechaStr) {
    const limpia = fechaStr.replace(/-/g, '');
    let suma = limpia.split('').reduce((acc, curr) => acc + parseInt(curr), 0);
    while (suma > 9) {
      suma = suma.toString().split('').reduce((acc, curr) => acc + parseInt(curr), 0);
    }
    return suma;
  }

  function priorizarPorVibracionYEstadisticas(listaNumeros, vibracion, calientes) {
    const vibracionStr = vibracion.toString();
    
    return listaNumeros.sort((a, b) => {
      let pesoA = 0;
      let pesoB = 0;

      if (calientes.includes(a)) pesoA += 3;
      if (calientes.includes(b)) pesoB += 3;

      if (a.includes(vibracionStr)) pesoA += 2;
      if (b.includes(vibracionStr)) pesoB += 2;

      return pesoB - pesoA;
    });
  }

  function generarPiramide(fechaStr) {
    const limpia = fechaStr.replace(/-/g, '');
    let digitos = [];
    if (limpia.length === 8) {
      digitos = (limpia.substring(6,8) + limpia.substring(4,6) + limpia.substring(0,4)).split('').map(Number);
    } else {
      digitos = limpia.split('').map(Number);
    }

    const niveles = [digitos];
    let actual = digitos;

    while (actual.length > 1) {
      const siguiente = [];
      for (let i = 0; i < actual.length - 1; i++) {
        siguiente.push((actual[i] + actual[i+1]) % 10);
      }
      niveles.push(siguiente);
      actual = siguiente;
    }
    return niveles;
  }

  function obtenerNumerosDePiramide(niveles, longitud) {
    const encontrados = new Set();
    const strNiveles = niveles.map(n => n.join(''));
    
    for (let fila of strNiveles) {
      for (let i = 0; i <= fila.length - longitud; i++) {
        encontrados.add(fila.substring(i, i + longitud));
      }
      const invertida = fila.split('').reverse().join('');
      for (let i = 0; i <= invertida.length - longitud; i++) {
        encontrados.add(invertida.substring(i, i + longitud));
      }
    }

    let diagIzq = '', diagDer = '';
    for (let i = 0; i < niveles.length; i++) {
      diagIzq += niveles[i][0];
      diagDer += niveles[i][niveles[i].length - 1];
    }
    for (let i = 0; i <= diagIzq.length - longitud; i++) {
      encontrados.add(diagIzq.substring(i, i + longitud));
      encontrados.add(diagDer.substring(i, i + longitud));
    }

    return Array.from(encontrados);
  }

  function generar() {
    const juego = document.getElementById('gameSelect').value;
    const fechaVal = document.getElementById('dateInput').value;
    if (!fechaVal) return;

    const { calientes } = analizarFrecuencias();
    const vibracionDia = calcularNumeroAtraccion(fechaVal);
    const niveles = generarPiramide(fechaVal);
    
    const htmlPiramide = niveles.map(n => n.join(' ')).join('<br>');
    document.getElementById('pyramidContainer').innerHTML = htmlPiramide;

    const resBox = document.getElementById('resultsContainer');
    resBox.innerHTML = '';

    const digitoPunta = niveles[niveles.length - 1][0];

    if (juego === 'quiniela') {
      const turnoTexto = document.getElementById('shiftSelect').options[document.getElementById('shiftSelect').selectedIndex].text;
      document.getElementById('resultsTitle').innerText = `Pronóstico Quiniela (${turnoTexto}) - Vib. ${vibracionDia}`;

      const candidatos2 = obtenerNumerosDePiramide(niveles, 2);

      const pares = candidatos2.filter(num => parseInt(num[1]) % 2 === 0);
      const impares = candidatos2.filter(num => parseInt(num[1]) % 2 !== 0);
      const candidatos3 = obtenerNumerosDePiramide(niveles, 3);
      const candidatos4 = obtenerNumerosDePiramide(niveles, 4);

      const seleccionPares = priorizarPorVibracionYEstadisticas(pares, vibracionDia, calientes).slice(0, 4);
      const seleccionImpares = priorizarPorVibracionYEstadisticas(impares, vibracionDia, calientes).slice(0, 4);
      const seleccionTernos = priorizarPorVibracionYEstadisticas(candidatos3, vibracionDia, calientes).slice(0, 4);
      const seleccionCuaternos = priorizarPorVibracionYEstadisticas(candidatos4, vibracionDia, calientes).slice(0, 4);

      resBox.innerHTML = `
        <div class="grid-2">
          <div class="card">
            <div class="card-title">Dígito Punta</div>
            <div class="card-value">${digitoPunta}</div>
          </div>
          <div class="card">
            <div class="card-title">Ambos (Pares)</div>
            <div class="card-value">${seleccionPares.join(' - ') || 'N/A'}</div>
          </div>
        </div>
        <div class="card">
          <div class="card-title">Ambos Impares</div>
          <div class="card-value">${seleccionImpares.join(' - ') || 'N/A'}</div>
        </div>
        <div class="card">
          <div class="card-title">Ternos (3 Cifras)</div>
          <div class="card-value">${seleccionTernos.join(' - ') || 'N/A'}</div>
        </div>
        <div class="card">
          <div class="card-title">Cuaternos (4 Cifras)</div>
          <div class="card-value">${seleccionCuaternos.join(' - ') || 'N/A'}</div>
        </div>
      `;
    } else {
      let min = 0, max = 45, nombre = 'Quini 6';
      if (juego === 'megalotto') {
        min = 1; max = 36; nombre = 'Mega Lotto PY';
      }
      document.getElementById('resultsTitle').innerText = `Pronóstico para ${nombre}`;

      const candidatos = obtenerNumerosDePiramide(niveles, 2);
      const validos = Array.from(new Set(
        candidatos
          .map(n => parseInt(n))
          .filter(n => n >= min && n <= max)
      )).map(n => n < 10 ? '0' + n : '' + n);

      let finalNums = priorizarPorVibracionYEstadisticas(validos, vibracionDia, calientes).slice(0, 6);
      
      while (finalNums.length < 6) {
        let rand = Math.floor(Math.random() * (max - min + 1)) + min;
        let randStr = rand < 10 ? '0' + rand : '' + rand;
        if (!finalNums.includes(randStr)) finalNums.push(randStr);
      }
      finalNums.sort((a,b) => parseInt(a) - parseInt(b));

      resBox.innerHTML = `
        <div class="card">
          <div class="card-title">6 Números Recomendados</div>
          <div class="card-value">${finalNums.join(' - ')}</div>
        </div>
      `;
    }
  }

  alCambiarJuego();
  generar();
</script>

</body>
</html>
