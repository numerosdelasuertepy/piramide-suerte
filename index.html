<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pirámide de la Suerte 🍀</title>
  <style>
    :root {
      --primary: #1b4332;
      --secondary: #2d6a4f;
      --accent: #d90429;
      --bg: #f8f9fa;
      --card-bg: #ffffff;
      --text: #212529;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 500px;
      background: var(--card-bg);
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    h1 {
      text-align: center;
      color: var(--primary);
      margin-bottom: 5px;
      font-size: 26px;
    }
    .subtitle {
      text-align: center;
      color: #6c757d;
      font-size: 14px;
      margin-bottom: 20px;
    }
    label {
      font-weight: 600;
      display: block;
      margin-top: 15px;
      margin-bottom: 5px;
      font-size: 14px;
    }
    select, input[type="date"] {
      width: 100%;
      padding: 10px;
      border: 1px solid #ced4da;
      border-radius: 8px;
      font-size: 15px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 12px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 20px;
      transition: background 0.2s;
    }
    button:hover {
      background-color: var(--secondary);
    }
    .section-title {
      color: var(--primary);
      font-size: 16px;
      border-bottom: 2px solid #e9ecef;
      padding-bottom: 5px;
      margin-top: 25px;
      margin-bottom: 15px;
    }
    .pyramid-box {
      background: #e8f5e9;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
      font-family: 'Courier New', Courier, monospace;
      font-weight: bold;
      font-size: 18px;
      line-height: 1.4;
      color: var(--primary);
      letter-spacing: 4px;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .card {
      background: #f8f9fa;
      border: 1px solid #e9ecef;
      border-radius: 8px;
      padding: 12px;
      text-align: center;
      margin-bottom: 10px;
    }
    .card-title {
      font-size: 12px;
      font-weight: bold;
      color: #495057;
      text-transform: uppercase;
      margin-bottom: 5px;
    }
    .card-value {
      font-size: 18px;
      font-weight: bold;
      color: var(--accent);
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Pirámide de la Suerte 🍀</h1>
  <div class="subtitle">Pronósticos guiados por la Numerología de la Fecha</div>

  <label for="gameSelect">Selecciona el Juego / Sorteo:</label>
  <select id="gameSelect">
    <option value="quiniela">Quiniela (Paraguay / Argentina)</option>
    <option value="quini6">Quini 6 (00 - 45)</option>
    <option value="megalotto">Mega Lotto PY (01 - 40)</option>
  </select>

  <label for="dateInput">Selecciona la Fecha:</label>
  <input type="date" id="dateInput">

  <button onclick="generar()">Generar Pronóstico</button>

  <div class="section-title">Pirámide del Día</div>
  <div id="pyramidContainer" class="pyramid-box">--</div>

  <div id="resultsTitle" class="section-title">Resultados</div>
  <div id="resultsContainer"></div>
</div>

<script>
  document.getElementById('dateInput').valueAsDate = new Date();

  // Calcula el número de atracción de la fecha (Reducción Numerológica a 1 dígito)
  function calcularNumeroAtraccion(fechaStr) {
    const limpia = fechaStr.replace(/-/g, '');
    let suma = limpia.split('').reduce((acc, curr) => acc + parseInt(curr), 0);
    while (suma > 9) {
      suma = suma.toString().split('').reduce((acc, curr) => acc + parseInt(curr), 0);
    }
    return suma;
  }

  // Ordena/Selecciona dando prioridad a números que resuenan con la vibración del día
  function priorizarPorVibracion(listaNumeros, vibracion) {
    const vibracionStr = vibracion.toString();
    const conAtraccion = [];
    const normales = [];

    listaNumeros.forEach(num => {
      const sumaDigitos = num.toString().split('').reduce((acc, curr) => acc + parseInt(curr), 0);
      const sumaReducida = (sumaDigitos % 9 === 0 && sumaDigitos > 0) ? 9 : sumaDigitos % 9;

      // Si el número contiene la cifra magnética o suma su valor vibracional, atrae preferencia
      if (num.toString().includes(vibracionStr) || sumaReducida === vibracion) {
        conAtraccion.push(num);
      } else {
        normales.push(num);
      }
    });

    // Devuelve los de mayor atracción numerológica combinados con los demás
    return [...conAtraccion, ...normales];
  }

  function generarPiramide(fechaStr) {
    const limpia = fechaStr.replace(/-/g, '');
    let digitos = [];
    if (limpia.length === 8) {
      digitos = (limpia.substring(6,8) + limpia.substring(4,6) + limpia.substring(0,4)).split('').map(Number);
    } else {
      digitos = limpia.split('').map(Number);
    }

    const niveles = [digitos];
    let actual = digitos;

    while (actual.length > 1) {
      const siguiente = [];
      for (let i = 0; i < actual.length - 1; i++) {
        siguiente.push((actual[i] + actual[i+1]) % 10);
      }
      niveles.push(siguiente);
      actual = siguiente;
    }
    return niveles;
  }

  function obtenerNumerosDePiramide(niveles, longitud) {
    const encontrados = new Set();
    const strNiveles = niveles.map(n => n.join(''));
    
    for (let fila of strNiveles) {
      for (let i = 0; i <= fila.length - longitud; i++) {
        encontrados.add(fila.substring(i, i + longitud));
      }
      const invertida = fila.split('').reverse().join('');
      for (let i = 0; i <= invertida.length - longitud; i++) {
        encontrados.add(invertida.substring(i, i + longitud));
      }
    }

    let diagIzq = '', diagDer = '';
    for (let i = 0; i < niveles.length; i++) {
      diagIzq += niveles[i][0];
      diagDer += niveles[i][niveles[i].length - 1];
    }
    for (let i = 0; i <= diagIzq.length - longitud; i++) {
      encontrados.add(diagIzq.substring(i, i + longitud));
      encontrados.add(diagDer.substring(i, i + longitud));
    }

    return Array.from(encontrados);
  }

  function generar() {
    const juego = document.getElementById('gameSelect').value;
    const fechaVal = document.getElementById('dateInput').value;
    if (!fechaVal) return;

    const vibracionDia = calcularNumeroAtraccion(fechaVal);
    const niveles = generarPiramide(fechaVal);
    
    const htmlPiramide = niveles.map(n => n.join(' ')).join('<br>');
    document.getElementById('pyramidContainer').innerHTML = htmlPiramide;

    const resBox = document.getElementById('resultsContainer');
    resBox.innerHTML = '';

    const digitoPunta = niveles[niveles.length - 1][0];

    if (juego === 'quiniela') {
      document.getElementById('resultsTitle').innerText = `Pronóstico por Atracción Numerológica (Vibración ${vibracionDia})`;

      const candidatos2 = obtenerNumerosDePiramide(niveles, 2);

      const pares = candidatos2.filter(num => parseInt(num[1]) % 2 === 0);
      const impares = candidatos2.filter(num => parseInt(num[1]) % 2 !== 0);
      const candidatos3 = obtenerNumerosDePiramide(niveles, 3);
      const candidatos4 = obtenerNumerosDePiramide(niveles, 4);

      // Selección fundamentada en la vibración astrológica/numerológica de la fecha
      const seleccionPares = priorizarPorVibracion(pares, vibracionDia).slice(0, 4);
      const seleccionImpares = priorizarPorVibracion(impares, vibracionDia).slice(0, 4);
      const seleccionTernos = priorizarPorVibracion(candidatos3, vibracionDia).slice(0, 4);
      const seleccionCuaternos = priorizarPorVibracion(candidatos4, vibracionDia).slice(0, 4);

      resBox.innerHTML = `
        <div class="grid-2">
          <div class="card">
            <div class="card-title">Dígito Punta</div>
            <div class="card-value">${digitoPunta}</div>
          </div>
          <div class="card">
            <div class="card-title">Ambos (Pares)</div>
            <div class="card-value">${seleccionPares.join(' - ') || 'N/A'}</div>
          </div>
        </div>
        <div class="card">
          <div class="card-title">Ambos Impares</div>
          <div class="card-value">${seleccionImpares.join(' - ') || 'N/A'}</div>
        </div>
        <div class="card">
          <div class="card-title">Ternos (3 Cifras)</div>
          <div class="card-value">${seleccionTernos.join(' - ') || 'N/A'}</div>
        </div>
        <div class="card">
          <div class="card-title">Cuaternos (4 Cifras)</div>
          <div class="card-value">${seleccionCuaternos.join(' - ') || 'N/A'}</div>
        </div>
      `;
    } else {
      let min = 0, max = 45, nombre = 'Quini 6';
      if (juego === 'megalotto') {
        min = 1; max = 40; nombre = 'Mega Lotto PY';
      }
      document.getElementById('resultsTitle').innerText = `Pronóstico Astrológico para ${nombre}`;

      const candidatos = obtenerNumerosDePiramide(niveles, 2);
      const validos = Array.from(new Set(
        candidatos
          .map(n => parseInt(n))
          .filter(n => n >= min && n <= max)
      ));

      let ordenadosVibracion = priorizarPorVibracion(validos, vibracionDia);
      let finalNums = ordenadosVibracion.slice(0, 6);
      
      while (finalNums.length < 6) {
        let rand = Math.floor(Math.random() * (max - min + 1)) + min;
        if (!finalNums.includes(rand)) finalNums.push(rand);
      }
      finalNums.sort((a,b) => a - b);

      const formateados = finalNums.map(n => n < 10 ? '0' + n : '' + n);

      resBox.innerHTML = `
        <div class="card">
          <div class="card-title">6 Números Recomendados (Vibración ${vibracionDia})</div>
          <div class="card-value">${formateados.join(' - ')}</div>
        </div>
      `;
    }
  }

  generar();
</script>

</body>
</html>
